<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6B3A">
<title>Attendance — Aadhya Arogya</title>
<style>
:root{
  --green:#0B6B3A; --ink:#10231B; --paper:#F2F6F3;
  --line:#D9E3DC; --muted:#6E7C74; --red:#B3261E; --amber:#A85B00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--paper);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:16px;
  font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}

.app{width:100%;max-width:400px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(16,35,27,.10)}
.head{background:var(--green);color:#fff;padding:22px 22px 20px;text-align:center}
.head h1{font-size:19px;font-weight:700;letter-spacing:1.6px}
.head h2{font-size:14px;font-weight:500;letter-spacing:2.6px;opacity:.9;margin-top:3px}
.clock{font-size:13px;opacity:.85;margin-top:10px}

.body{padding:20px 22px 24px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.4px;margin-bottom:6px}
.loc{background:var(--paper);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-size:17px;font-weight:600;margin-bottom:18px}
.loc small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:2px}

select{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#fff;
  font-size:16px;margin-bottom:18px;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236E7C74' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:20px}

.pinbox{display:flex;gap:9px;justify-content:center;padding:15px;border:1px solid var(--line);
  border-radius:11px;background:#fff;margin-bottom:6px}
.pinbox i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}
.pinbox i.on{background:var(--green);border-color:var(--green)}
.pinbox.err{border-color:var(--red);animation:shake .28s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.pad button{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:15px 0;font-size:21px;font-weight:500}
.pad button:active{background:var(--line)}
.pad .sm{font-size:14px;color:var(--muted)}

.msg{min-height:20px;font-size:13.5px;text-align:center;margin:6px 0 2px;color:var(--red)}
.go{width:100%;background:var(--green);color:#fff;border:0;border-radius:12px;padding:17px;
  font-size:16.5px;font-weight:700;letter-spacing:1.2px;margin-top:8px}
.go:disabled{background:var(--line);color:var(--muted)}
.go.out{background:var(--ink)}

.status{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:#EAF3ED;
  color:var(--green);font-weight:600;font-size:12px}
.pill.off{background:#FBEFE0;color:var(--amber)}

.over{position:fixed;inset:0;background:rgba(16,35,27,.75);z-index:20;
  display:flex;align-items:center;justify-content:center;padding:18px}
.over[hidden]{display:none}
.pop{background:#fff;border-radius:18px;padding:28px 24px;text-align:center;width:100%;max-width:360px}
.pop .tick{width:66px;height:66px;border-radius:50%;background:var(--green);color:#fff;
  display:grid;place-items:center;margin:0 auto 14px;font-size:31px}
.pop h3{font-size:21px;font-weight:700}
.pop .who{font-size:15px;color:var(--muted);margin-top:4px}
.pop .big{font-size:33px;font-weight:700;margin-top:8px}
.pop .note{font-size:13px;color:var(--amber);margin-top:8px}
#scan video{width:100%;border-radius:12px;background:#000;aspect-ratio:1;object-fit:cover}
#scan p{font-size:13.5px;color:var(--muted);margin-top:12px}
.link{margin-top:14px;font-size:14px;color:var(--muted);text-decoration:underline;cursor:pointer}
</style>
</head>
<body>

<div class="app"><div class="card">
  <div class="head">
    <h1>AADHYA AROGYA</h1>
    <h2>ATTENDANCE</h2>
    <div class="clock" id="clock">—</div>
  </div>
  <div class="body">
    <div class="lbl">Location</div>
    <div class="loc"><span id="locCode">Loading…</span><small id="locSub"></small></div>

    <div class="lbl">Employee</div>
    <select id="emp"><option value="">Select Employee</option></select>

    <div class="lbl">PIN</div>
    <div class="pinbox" id="pinbox"></div>

    <div class="pad">
      <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button>
      <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button>
      <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button>
      <button class="sm" data-x="clear">Clear</button>
      <button data-n="0">0</button>
      <button class="sm" data-x="back">Back</button>
    </div>

    <div class="msg" id="msg"></div>
    <button class="go" id="go" disabled>LOGIN</button>

    <div class="status"><span class="pill" id="net">Online</span><span id="queued"></span></div>
  </div>
</div></div>

<div class="over" id="done" hidden><div class="pop">
  <div class="tick">✓</div>
  <h3 id="dTitle"></h3>
  <div class="who" id="dWho"></div>
  <div class="big" id="dAt"></div>
  <div class="note" id="dNote"></div>
</div></div>

<div class="over" id="scan" hidden><div class="pop">
  <h3>Scan the shop QR code</h3>
  <video id="cam" playsinline muted></video>
  <p id="scanMsg">Point the camera at the QR code in the shop.</p>
  <div class="link" id="scanCancel">Cancel</div>
</div></div>

<script>
/* ==========================================================
   SETTINGS — fill in the first two, then save.
   ========================================================== */
const SUPABASE_URL      = 'https://llvvswsdmjhjacowzyfx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_gXWZddjxH5_y3tcuO1N3lw_NE4pEKCJ';
const REQUIRE_QR_ON_LOGOUT = true;   // false = skip the scan at logout
const PIN_LENGTH = 6;
/* ========================================================== */

const $ = id => document.getElementById(id);
const LOC_TOKEN = new URLSearchParams(location.search).get('loc') || '';
let staff = [], pin = '', busy = false, camStream = null;

const DEVICE = (() => {
  let d = null;
  try { d = localStorage.getItem('deviceId'); } catch (e) {}
  if (!d) {
    d = 'DEV-' + Math.random().toString(36).slice(2, 8).toUpperCase();
    try { localStorage.setItem('deviceId', d); } catch (e) {}
  }
  return d;
})();

async function rpc(fn, args) {
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY,
               'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
               'Content-Type': 'application/json' },
    body: JSON.stringify(args)
  });
  if (!r.ok) {
    const body = await r.text().catch(() => '');
    if (r.status === 401 || r.status === 403) throw new Error('Key rejected (' + r.status + ')');
    if (r.status === 404) throw new Error('Function missing — was schema.sql run?');
    throw new Error('Server error ' + r.status + ' ' + body.slice(0, 80));
  }
  return r.json();
}

/* ---- offline queue: a punch is never lost to a dropped connection ---- */
function queue(v) {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem('q') || '[]');
    localStorage.setItem('q', JSON.stringify(v));
  } catch (e) { return []; }
}
function paintQueue() {
  const n = (queue() || []).length;
  $('queued').textContent = n ? '  ·  ' + n + ' waiting to sync' : '';
}
async function flush() {
  const q = queue() || [];
  if (!q.length || !navigator.onLine) return;
  try {
    const res = await rpc(q[0].fn, q[0].args);
    // "Already logged in" on replay means it landed before the connection died
    if (res && (res.ok || /Already logged in|No open session/.test(res.error || ''))) {
      const rest = queue(); rest.shift(); queue(rest); paintQueue();
      flush(); loadRoster();
    }
  } catch (e) { /* keep it queued */ }
}
setInterval(flush, 20000);
addEventListener('online', () => { paintNet(); flush(); });
addEventListener('offline', paintNet);
function paintNet() {
  $('net').textContent = navigator.onLine ? 'Online' : 'Offline — saved on phone';
  $('net').className = 'pill' + (navigator.onLine ? '' : ' off');
}

function paintPin(bad) {
  $('pinbox').className = 'pinbox' + (bad ? ' err' : '');
  $('pinbox').innerHTML = Array.from({ length: PIN_LENGTH },
    (_, i) => '<i class="' + (i < pin.length ? 'on' : '') + '"></i>').join('');
  refresh();
}
document.querySelector('.pad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || busy) return;
  if (b.dataset.n && pin.length < PIN_LENGTH) pin += b.dataset.n;
  else if (b.dataset.x === 'clear') pin = '';
  else if (b.dataset.x === 'back') pin = pin.slice(0, -1);
  $('msg').textContent = ''; paintPin();
});

const current = () => staff.find(s => s.id === $('emp').value) || null;

function refresh() {
  const e = current(), btn = $('go');
  btn.textContent = e && e.is_in ? 'LOGOUT' : 'LOGIN';
  btn.className = 'go' + (e && e.is_in ? ' out' : '');
  btn.disabled = !e || pin.length !== PIN_LENGTH || busy;
}

async function loadRoster() {
  if (!LOC_TOKEN) {
    $('locCode').textContent = 'Not set up';
    $('locSub').textContent = 'This link is missing its shop code.';
    return;
  }
  if (!navigator.onLine) return;
  try {
    const r = await rpc('app_roster', { p_token: LOC_TOKEN });
    if (!r || !r.ok) {
      $('locCode').textContent = 'Not registered';
      $('locSub').textContent = (r && r.error) || 'Check the link.';
      return;
    }
    $('locCode').textContent = r.location.code;
    $('locSub').textContent = r.location.name + '  ·  ' + r.location.start + ' – ' + r.location.end;
    staff = r.employees || [];
    const keep = $('emp').value;
    $('emp').innerHTML = '<option value="">Select Employee</option>' +
      staff.map(s => '<option value="' + s.id + '"' + (s.id === keep ? ' selected' : '') + '>' +
        s.name + (s.is_in ? '  — in since ' + s.since : '') + '</option>').join('');
    refresh();
  } catch (e) {
    // Only stay quiet if we already have a roster on screen — otherwise the
    // page would sit on "Loading..." forever and tell nobody why.
    if (!staff.length) {
      $('locCode').textContent = 'Cannot connect';
      $('locSub').textContent = String(e.message || e).slice(0, 90);
      $('msg').textContent = 'Check the Project URL and key in this file.';
    }
  }
}
$('emp').addEventListener('change', () => { pin = ''; $('msg').textContent = ''; paintPin(); });

function stopCam() { if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
$('scanCancel').onclick = () => { stopCam(); $('scan').hidden = true; busy = false; refresh(); };

async function scanQr() {
  return new Promise(async resolve => {
    $('scan').hidden = false;
    const video = $('cam');
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = camStream; await video.play();
    } catch (err) {
      $('scanMsg').textContent = 'Camera unavailable. Ask the owner to turn off the QR step.';
      return;
    }
    if (!('BarcodeDetector' in window)) {
      $('scanMsg').textContent = 'This phone cannot scan QR codes. Ask the owner to turn off the QR step.';
      return;
    }
    const det = new BarcodeDetector({ formats: ['qr_code'] });
    const tick = async () => {
      if ($('scan').hidden) return resolve(null);
      try {
        const codes = await det.detect(video);
        if (codes.length) { stopCam(); $('scan').hidden = true; return resolve(codes[0].rawValue); }
      } catch (e) {}
      requestAnimationFrame(tick);
    };
    tick();
  });
}

$('go').onclick = async () => {
  const emp = current();
  if (!emp || pin.length !== PIN_LENGTH) return;
  if (emp.locked) { $('msg').textContent = 'This employee is locked out. Wait a few minutes.'; return; }

  const loggingOut = emp.is_in;
  busy = true; refresh();

  if (loggingOut && REQUIRE_QR_ON_LOGOUT) {
    const code = await scanQr();
    if (!code) { busy = false; refresh(); return; }
    if (code.trim() !== LOC_TOKEN) {
      busy = false; $('msg').textContent = 'That QR code is for a different shop.'; refresh(); return;
    }
  }

  const fn = loggingOut ? 'app_logout' : 'app_login';
  const args = { p_token: LOC_TOKEN, p_employee: emp.id, p_pin: pin, p_device: DEVICE };

  try {
    const r = await rpc(fn, args);
    busy = false;
    if (r && r.ok) success(r);
    else { pin = ''; paintPin(true); $('msg').textContent = (r && r.error) || 'Could not save.'; }
  } catch (e) {
    const q = queue() || []; q.push({ fn, args }); queue(q); paintQueue();
    busy = false;
    success({ action: loggingOut ? 'logout' : 'login', name: emp.name, queued: true,
              at: new Date().toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) });
  }
};

function success(r) {
  $('dTitle').textContent = r.action === 'logout' ? 'Logged out' : 'Logged in';
  $('dWho').textContent = r.name || '';
  $('dAt').textContent = r.at || '';
  $('dNote').textContent = r.queued
    ? 'Saved on this phone. It will upload when the internet is back.'
    : (r.late ? 'Marked late'
      : (r.worked ? Math.floor(r.worked / 60) + 'h ' + (r.worked % 60) + 'm worked' : ''));
  $('done').hidden = false;
  pin = ''; $('emp').value = ''; paintPin(); $('msg').textContent = '';
  setTimeout(() => { $('done').hidden = true; loadRoster(); }, 3000);
}
$('done').onclick = () => { $('done').hidden = true; loadRoster(); };

function tick() {
  $('clock').textContent = new Date().toLocaleString('en-IN',
    { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
}
tick(); setInterval(tick, 20000);
paintNet(); paintQueue(); paintPin(); loadRoster(); flush();
setInterval(loadRoster, 60000);
</script>
</body>
</html>
